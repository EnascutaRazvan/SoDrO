<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale = 1.0">
    <title>SoDrO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/icons/css/font-awesome.min.css">
</head>

<body>
    <section id="header-signin">
        <i class="fa fa-angle-left" style="font-size:36px"></i>
        <a href="#"><img class="logo-sign" src="assets/svg/logo.svg" alt="SoDrO Logo"></a>
        <br>
    </section>

    <form id="register-form" action="register_page.php" method="post">
        <div id="signin-form">

            <div id="signin-buttons">
                <a href="#" class="signin-button register">Register</a>
                <a href="login.html" class="signin-button login">Login</a>
            </div>


            <label for="username"></label>
            <input type="text" placeholder="Username" name="userName" required>

            <label for="psw"></label>
            <input type="password" placeholder="Password" name="psw" required>

            <label for="psw-repeat"></label>
            <input type="password" placeholder="Password (again)" name="psw-repeat" required>

            <label for="email"></label>
            <input type="text" placeholder="E-mail" name="email" required>

            <label for="email-repeat"></label>
            <input type="text" placeholder="E-mail (again)" name="email-repeat" required>


            <label>
                <input type="checkbox" checked="checked" name="remember" style="margin-bottom:15px">
            </label>

            <p>SoDrO does not sell your personal information <a href="#" style="color:dodgerblue">Terms & Privacy</a>.
            </p>

            <div class="clearfix"></div>
            <button type="button" class="cancelbtn">Cancel</button>
            <button type="submit" class="signupbtn">Sign Up</button>
        </div>
        </div>
    </form>


</body>
